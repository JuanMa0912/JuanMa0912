<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160" role="img" aria-label="MLOps to LLMOps to AgentOps" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title>MLOps to LLMOps to AgentOps</title>
<style>
text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
@keyframes fade-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { opacity: 0; transform: scale(.4); } 70% { transform: scale(1.12); } 100% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; transform: none !important; }
}

.stage { opacity: 0; animation: fade-up .6s ease-out forwards; }
.arrow { stroke: #7d8590; stroke-width: 2; fill: none; stroke-dasharray: 60;
          animation: draw .7s ease-out backwards; }
@keyframes draw { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
</style>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/></marker></defs>
<g class="stage" style="animation-delay:0.00s"><rect x="0.0" y="30" width="250" height="92" rx="12" fill="#6e768114" stroke="#4493f8" stroke-width="1.4"/><text x="125.0" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#4493f8">MLOps</text><text x="125.0" y="84" text-anchor="middle" font-size="11" fill="#7d8590">ingest / index</text><text x="125.0" y="101" text-anchor="middle" font-size="11" fill="#7d8590">train / serve</text></g>
<path class="arrow" d="M 262.0 76 H 311.0" marker-end="url(#a2)" style="animation-delay:0.35s"/>
<g class="stage" style="animation-delay:0.35s"><rect x="325.0" y="30" width="250" height="92" rx="12" fill="#6e768114" stroke="#a371f7" stroke-width="1.4"/><text x="450.0" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#a371f7">LLMOps</text><text x="450.0" y="84" text-anchor="middle" font-size="11" fill="#7d8590">prompts / RAG</text><text x="450.0" y="101" text-anchor="middle" font-size="11" fill="#7d8590">evals / observability</text></g>
<path class="arrow" d="M 587.0 76 H 636.0" marker-end="url(#a2)" style="animation-delay:0.70s"/>
<g class="stage" style="animation-delay:0.70s"><rect x="650.0" y="30" width="250" height="92" rx="12" fill="#6e768114" stroke="#3fb950" stroke-width="1.4"/><text x="775.0" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#3fb950">AgentOps</text><text x="775.0" y="84" text-anchor="middle" font-size="11" fill="#7d8590">autonomy / guardrails</text><text x="775.0" y="101" text-anchor="middle" font-size="11" fill="#7d8590">approvals / audit</text></g>
</svg>
